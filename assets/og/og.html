<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Motivify Open Graph image</title>
<link rel="stylesheet" href="../../style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #16181A; }
  .canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #16181A; color: #F2F0EB; }
  .mark { position: absolute; left: 72px; top: 72px; width: 72px; height: 72px; border-radius: 16px; outline: 1px solid #2C3034; }
  .kicker { position: absolute; left: 72px; top: 214px; font-size: 18px; color: #7FC4B2; }
  .tag { position: absolute; left: 72px; top: 252px; width: 560px; font: 400 62px/1.06 var(--serif); letter-spacing: -.02em; color: #F2F0EB; }
  .canvas .phone { position: absolute; width: 250px; padding: 8px; border-radius: 40px; background: #111315; outline: 1px solid #2C3034; }
  .canvas .phone img { border-radius: 32px; }
  .one { left: 668px; top: 64px; }
  .two { left: 940px; top: 112px; }
</style>
</head>
<body>
<div class="canvas">
<img class="mark" src="../img/apple-touch-icon.png" width="72" height="72" alt="">
<p class="kicker">Passages · practices · habits</p>
<p class="tag">A quiet minute of Stoic practice, every day.</p>
<div class="phone one"><img src="../img/today.webp" width="600" height="1339" alt=""></div>
<div class="phone two"><img src="../img/night.webp" width="600" height="1339" alt=""></div>
</div>
</body>
</html>
